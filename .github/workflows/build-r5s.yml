name: Build OpenWrt NanoPi R5S

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt stable version"
        required: true
        default: "25.12.5"

      firmware_version:
        description: "Custom firmware version"
        required: true
        default: "1.0.0"

      lan_ip:
        description: "LAN IP address"
        required: true
        default: "192.168.88.1"

      hostname:
        description: "Hostname"
        required: true
        default: "r5s"


permissions:
  contents: read


concurrency:
  group: openwrt-r5s-${{ github.ref }}
  cancel-in-progress: false


env:
  TARGET: rockchip
  SUBTARGET: armv8
  PROFILE: friendlyarm_nanopi-r5s

  DEVICE_DIR: devices/r5s


jobs:
  build:
    name: Build R5S
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Validate
      # --------------------------------------------------

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          test -n "${{ inputs.openwrt_version }}"
          test -n "${{ inputs.firmware_version }}"
          test -n "${{ inputs.lan_ip }}"
          test -n "${{ inputs.hostname }}"

          test -d "${DEVICE_DIR}"
          test -f "${DEVICE_DIR}/build.sh"
          test -f "${DEVICE_DIR}/packages.txt"

          test -f \
            "${DEVICE_DIR}/files/etc/uci-defaults/99-r5s-init"

          test -f \
            "${DEVICE_DIR}/files/etc/sysctl.d/99-disable-ipv6.conf"

          test -f \
            "${DEVICE_DIR}/files/etc/hotplug.d/iface/99-disable-ipv6"


      # --------------------------------------------------
      # Prepare custom rootfs
      # --------------------------------------------------

      - name: Prepare custom rootfs
        shell: bash
        run: |
          set -euo pipefail

          chmod 0755 \
            "${DEVICE_DIR}/build.sh" \
            "${DEVICE_DIR}/files/etc/uci-defaults/99-r5s-init" \
            "${DEVICE_DIR}/files/etc/hotplug.d/iface/99-disable-ipv6"

          cat > "${DEVICE_DIR}/files/etc/custom-build.conf" <<EOF
          LAN_IP='${{ inputs.lan_ip }}'
          HOSTNAME='${{ inputs.hostname }}'
          TIMEZONE='CST-8'
          ZONENAME='Asia/Shanghai'
          EOF

          cat > "${DEVICE_DIR}/files/etc/build-info" <<EOF
          DEVICE='NanoPi R5S'
          FIRMWARE_VERSION='${{ inputs.firmware_version }}'
          OPENWRT_VERSION='${{ inputs.openwrt_version }}'
          TARGET='${TARGET}/${SUBTARGET}'
          PROFILE='${PROFILE}'
          FILESYSTEM='squashfs'
          LAN_IP='${{ inputs.lan_ip }}'
          HOSTNAME='${{ inputs.hostname }}'
          BUILD_TIME='$(date -u +%Y-%m-%dT%H:%M:%SZ)'
          GIT_COMMIT='${GITHUB_SHA}'
          EOF

          echo "=== custom-build.conf ==="
          cat "${DEVICE_DIR}/files/etc/custom-build.conf"

          echo
          echo "=== build-info ==="
          cat "${DEVICE_DIR}/files/etc/build-info"


      # --------------------------------------------------
      # Prepare directories
      # --------------------------------------------------

      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p bin
          mkdir -p dl
          mkdir -p dist

          chmod 0777 bin dl


      # --------------------------------------------------
      # ImageBuilder
      # --------------------------------------------------

      - name: Pull OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="openwrt/imagebuilder:${TARGET}-${SUBTARGET}-${{ inputs.openwrt_version }}"

          echo "========================================"
          echo "OpenWrt ImageBuilder"
          echo "IMAGE:   ${IMAGE}"
          echo "TARGET:  ${TARGET}/${SUBTARGET}"
          echo "PROFILE: ${PROFILE}"
          echo "========================================"

          docker pull "${IMAGE}"


      # --------------------------------------------------
      # Build
      # --------------------------------------------------

      - name: Build OpenWrt R5S
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="openwrt/imagebuilder:${TARGET}-${SUBTARGET}-${{ inputs.openwrt_version }}"

          docker run --rm \
            -e PROFILE="${PROFILE}" \
            -e PACKAGE_FILE="/custom-device/packages.txt" \
            -e EXTRA_IMAGE_NAME="r5s-${{ inputs.firmware_version }}" \
            -v "${GITHUB_WORKSPACE}/bin:/builder/bin" \
            -v "${GITHUB_WORKSPACE}/dl:/builder/dl" \
            -v "${GITHUB_WORKSPACE}/${DEVICE_DIR}/files:/custom-files:ro" \
            -v "${GITHUB_WORKSPACE}/${DEVICE_DIR}:/custom-device:ro" \
            "${IMAGE}" \
            sh /custom-device/build.sh


      # --------------------------------------------------
      # Collect SquashFS image only
      # --------------------------------------------------

      - name: Collect R5S firmware
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist/*

          TARGET_DIR="bin/targets/${TARGET}/${SUBTARGET}"

          if [ ! -d "${TARGET_DIR}" ]; then
            echo "ERROR: target directory not found:"
            echo "${TARGET_DIR}"
            exit 1
          fi

          echo "=== Generated files ==="
          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "=== Collect SquashFS firmware ==="

          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*friendlyarm_nanopi-r5s*squashfs*.img.gz" \
              -o -name "*friendlyarm_nanopi-r5s*.manifest" \
              -o -name "*.buildinfo" \
              -o -name "profiles.json" \
              -o -name "sha256sums" \
            \) \
            -exec cp -v {} dist/ \;

          cp \
            "${DEVICE_DIR}/files/etc/build-info" \
            dist/build-info.txt


      # --------------------------------------------------
      # Verify SquashFS
      # --------------------------------------------------

      - name: Verify R5S SquashFS firmware
        shell: bash
        run: |
          set -euo pipefail

          SYSUPGRADE_COUNT="$(
            find dist \
              -maxdepth 1 \
              -type f \
              -name '*friendlyarm_nanopi-r5s*squashfs*sysupgrade*.img.gz' \
              | wc -l
          )"

          if [ "${SYSUPGRADE_COUNT}" -lt 1 ]; then
            echo "ERROR: R5S SquashFS sysupgrade firmware not found"
            echo
            echo "Files in dist:"
            find dist -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi

          # Make sure EXT4 firmware is not included
          if find dist \
            -maxdepth 1 \
            -type f \
            -name '*ext4*.img.gz' \
            | grep -q .; then

            echo "ERROR: EXT4 firmware found in artifact directory"
            exit 1
          fi

          echo "R5S SquashFS firmware verified."


      # --------------------------------------------------
      # SHA256
      # --------------------------------------------------

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          find . \
            -maxdepth 1 \
            -type f \
            ! -name SHA256SUMS \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS

          echo "=== SHA256SUMS ==="
          cat SHA256SUMS


      # --------------------------------------------------
      # Show artifacts
      # --------------------------------------------------

      - name: Show artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "NanoPi R5S Build Completed"
          echo "========================================"

          ls -lah dist/


      # --------------------------------------------------
      # Upload
      # --------------------------------------------------

      - name: Upload R5S firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-r5s-${{ inputs.openwrt_version }}-${{ inputs.firmware_version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90