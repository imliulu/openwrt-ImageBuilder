name: Build OpenWrt SNAPSHOT GL-MT3600BE

on:
  workflow_dispatch:
    inputs:
      firmware_version:
        description: "Custom firmware version"
        required: true
        default: "0.0.1-snapshot"

      lan_ip:
        description: "LAN IP address"
        required: true
        default: "192.168.88.1"

      hostname:
        description: "Hostname"
        required: true
        default: "mt3600be"

permissions:
  contents: read

concurrency:
  group: openwrt-mt3600be-snapshot-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: glinet_gl-mt3600be
  OPENWRT_VERSION: SNAPSHOT
  DEVICE_DIR: devices/mt3600be

jobs:
  build:
    name: Build MT3600BE SNAPSHOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          test -n "${{ inputs.firmware_version }}"
          test -n "${{ inputs.lan_ip }}"
          test -n "${{ inputs.hostname }}"

          test -d "${DEVICE_DIR}"
          test -f "${DEVICE_DIR}/build.sh"
          test -f "${DEVICE_DIR}/packages.txt"
          test -f "${DEVICE_DIR}/frpc.template"

          test -f \
            "${DEVICE_DIR}/files/etc/uci-defaults/99-custom-init"

          test -f \
            "${DEVICE_DIR}/files/etc/sysctl.d/99-disable-ipv6.conf"

          test -f \
            "${DEVICE_DIR}/files/etc/hotplug.d/iface/99-disable-ipv6"

      - name: Prepare custom rootfs
        shell: bash
        run: |
          set -euo pipefail

          chmod 0755 \
            "${DEVICE_DIR}/build.sh" \
            "${DEVICE_DIR}/files/etc/uci-defaults/99-custom-init" \
            "${DEVICE_DIR}/files/etc/hotplug.d/iface/99-disable-ipv6"

          cat > "${DEVICE_DIR}/files/etc/custom-build.conf" <<EOF
          LAN_IP='${{ inputs.lan_ip }}'
          HOSTNAME='${{ inputs.hostname }}'
          TIMEZONE='CST-8'
          ZONENAME='Asia/Shanghai'
          EOF

          cat > "${DEVICE_DIR}/files/etc/build-info" <<EOF
          DEVICE='GL.iNet GL-MT3600BE'
          FIRMWARE_VERSION='${{ inputs.firmware_version }}'
          OPENWRT_VERSION='${OPENWRT_VERSION}'
          TARGET='${TARGET}/${SUBTARGET}'
          PROFILE='${PROFILE}'
          LAN_IP='${{ inputs.lan_ip }}'
          HOSTNAME='${{ inputs.hostname }}'
          BUILD_TIME='$(date -u +%Y-%m-%dT%H:%M:%SZ)'
          GIT_COMMIT='${GITHUB_SHA}'
          EOF

          echo "=== custom-build.conf ==="
          cat "${DEVICE_DIR}/files/etc/custom-build.conf"

          echo
          echo "=== build-info ==="
          cat "${DEVICE_DIR}/files/etc/build-info"

      - name: Prepare FRP configuration
        shell: bash
        env:
          FRP_TOKEN: ${{ secrets.FRP_TOKEN }}
          FRP_SERVER_ADDR: ${{ vars.FRP_SERVER_ADDR }}
        run: |
          set -euo pipefail

          if [ -z "${FRP_TOKEN:-}" ]; then
            echo "ERROR: FRP_TOKEN is empty"
            exit 1
          fi

          if [ -z "${FRP_SERVER_ADDR:-}" ]; then
            echo "ERROR: FRP_SERVER_ADDR is empty"
            exit 1
          fi

          mkdir -p \
            "${DEVICE_DIR}/files/etc/config"

          python3 - <<'PY'
          import os
          from pathlib import Path

          device_dir = Path(os.environ["DEVICE_DIR"])
          template_file = device_dir / "frpc.template"
          output_file = device_dir / "files/etc/config/frpc"

          content = template_file.read_text()

          content = content.replace(
              "__FRP_SERVER_ADDR__",
              os.environ["FRP_SERVER_ADDR"],
          )

          content = content.replace(
              "__FRP_TOKEN__",
              os.environ["FRP_TOKEN"],
          )

          output_file.write_text(content)
          PY

          if grep -q '__FRP_' \
            "${DEVICE_DIR}/files/etc/config/frpc"; then

            echo "ERROR: unresolved FRP template variable"
            exit 1
          fi

          grep -q "option server_addr" \
            "${DEVICE_DIR}/files/etc/config/frpc"

          grep -q "option token" \
            "${DEVICE_DIR}/files/etc/config/frpc"

          chmod 0644 \
            "${DEVICE_DIR}/files/etc/config/frpc"

          echo "FRP configuration prepared"

      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p bin
          mkdir -p dl
          mkdir -p dist

          chmod 0777 bin dl

      - name: Pull OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="openwrt/imagebuilder:${TARGET}-${SUBTARGET}-${OPENWRT_VERSION}"

          echo "========================================"
          echo "OpenWrt ImageBuilder"
          echo "IMAGE:   ${IMAGE}"
          echo "TARGET:  ${TARGET}/${SUBTARGET}"
          echo "PROFILE: ${PROFILE}"
          echo "========================================"

          docker pull "${IMAGE}"

      - name: Build OpenWrt MT3600BE
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="openwrt/imagebuilder:${TARGET}-${SUBTARGET}-${OPENWRT_VERSION}"

          docker run --rm \
            -e PROFILE="${PROFILE}" \
            -e PACKAGE_FILE="/custom-device/packages.txt" \
            -e EXTRA_IMAGE_NAME="mt3600be-${{ inputs.firmware_version }}" \
            -v "${GITHUB_WORKSPACE}/bin:/builder/bin" \
            -v "${GITHUB_WORKSPACE}/dl:/builder/dl" \
            -v "${GITHUB_WORKSPACE}/${DEVICE_DIR}/files:/custom-files:ro" \
            -v "${GITHUB_WORKSPACE}/${DEVICE_DIR}:/custom-device:ro" \
            "${IMAGE}" \
            sh /custom-device/build.sh

      - name: Collect MT3600BE firmware
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist/*

          TARGET_DIR="bin/targets/${TARGET}/${SUBTARGET}"

          if [ ! -d "${TARGET_DIR}" ]; then
            echo "ERROR: target directory not found:"
            echo "${TARGET_DIR}"
            exit 1
          fi

          echo "=== Generated files ==="

          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "=== Collect MT3600BE firmware ==="

          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*gl-mt3600be*.bin" \
              -o -name "*gl-mt3600be*.itb" \
              -o -name "*gl-mt3600be*.manifest" \
              -o -name "*.buildinfo" \
              -o -name "profiles.json" \
              -o -name "sha256sums" \
            \) \
            -exec cp -v {} dist/ \;

          cp \
            "${DEVICE_DIR}/files/etc/build-info" \
            dist/build-info.txt

      - name: Verify MT3600BE firmware
        shell: bash
        run: |
          set -euo pipefail

          SYSUPGRADE_COUNT="$(
            find dist \
              -maxdepth 1 \
              -type f \
              -name '*gl-mt3600be*sysupgrade*.bin' \
              | wc -l
          )"

          if [ "${SYSUPGRADE_COUNT}" -lt 1 ]; then
            echo "ERROR: MT3600BE sysupgrade firmware not found"

            echo
            echo "Files in dist:"

            find dist \
              -maxdepth 1 \
              -type f \
              -printf '%f\n'

            exit 1
          fi

          echo "MT3600BE sysupgrade firmware verified."

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          find . \
            -maxdepth 1 \
            -type f \
            ! -name SHA256SUMS \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS

          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Show artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GL-MT3600BE Build Completed"
          echo "========================================"

          ls -lah dist/

      - name: Upload MT3600BE firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mt3600be-snapshot-${{ inputs.firmware_version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90